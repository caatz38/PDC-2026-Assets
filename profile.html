
<style>

  .pdc-root .col-left {

    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
  }

  /* RIGHT COLUMN */
  .pdc-root .col-right {
    flex: 1 1 0 !important;
    min-width: 0 !important;

    flex-direction: column !important;

    padding: 0 14px !important;
    height: 34px !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    font-family: Nunito, Arial, sans-serif !important;

  }

    margin-top: 6px !important;

  }

  .pdc-root .btn-save {

    color: #fff !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 0 18px !important;
    height: 43px !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    font-family: Nunito, Arial, sans-serif !important;

    color: #fff !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 0 18px !important;
    height: 43px !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    font-family: Nunito, Arial, sans-serif !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;

<div class="pdc-root">
  <div class="desktop">

    <section class="background">
      <img class="calling-1-icon" alt="" src="https://github.com/caatz38/pdc-gassin/blob/main/assets/dashboard/Vector.png?raw=true" />
    </section>
    <img class="background1-icon" alt="" src="https://github.com/caatz38/pdc-gassin/blob/main/assets/dashboard/bottom.png?raw=true" />

    <section class="sidebar">
      <img class="pdc-logo-scaled-1-icon" alt="PDC Logo" src="https://github.com/caatz38/pdc-gassin/blob/main/assets/pdc%20logo.avif?raw=true" />
      <b class="pradita-dirgantara-competition">Pradita Dirgantara<br />Competition 2026</b>

      <button class="home-menu">
        <div class="home-menu-child"></div>
        <div class="frame-parent">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <b class="home">Home</b>
        </div>
      </button>

      <button class="profile-menu">
        <div class="home-menu-child"></div>
        <div class="frame-group">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 15H7a4 4 0 0 0-4 4v2"/><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><circle cx="10" cy="7" r="4"/></svg>
          <b class="profile">Profile</b>
        </div>
      </button>

      <button class="logout-menu">
        <div class="home-menu-child"></div>
        <div class="frame-logout">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <b class="logout">Logout</b>
        </div>
      </button>
    </section>

    <!-- REPLACED CARD: Locofy Profile Form -->
    <main class="main-content">
      <div class="profile-form-card">

        <!-- LEFT COLUMN -->
        <div class="col-left">
          <div>
            <span class="field-label">Full Name</span>
            <input class="field-input" type="text" placeholder="e.g., Wirastanto" />
          </div>
          <div>
            <span class="field-label">Phone Number</span>
            <input class="field-input" type="text" placeholder="+62 6767 6767" />
          </div>
          <div>
            <span class="field-label">NISN</span>
            <input class="field-input" type="text" placeholder="the one with 10 digit number" />
          </div>
          <div>
            <span class="field-label">School Name</span>
            <input class="field-input" type="text" placeholder="e.g., SMPN 67 Lempuyangan" />
          </div>
          <div>
            <span class="field-label">Grade</span>
            <input class="field-input" type="text" placeholder="-" />
          </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-right">
          <div>
            <span class="field-label">Upload Student Card</span>
            <div class="upload-row">
              <button class="choose-btn" type="button">Choose File</button>
              <span class="no-file">No file chosen</span>
            </div>
          </div>
          <div>
            <span class="field-label">Upload ID Photo 3x4</span>
            <div class="upload-row">
              <button class="choose-btn" type="button">Choose File</button>
              <span class="no-file">No file chosen</span>
            </div>
          </div>

          <div style="flex:1"></div>

          <div class="action-row">
            <button class="btn-save" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save
            </button>
            <button class="btn-submit" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Submit
            </button>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>
